<!-- ── Libraries picker modal ──
     Opened via $dispatch('libraries-modal-open', {id, name}). -->
<div
  x-data="{
    open: false,
    libraryId: null,
    libraryName: '',
    entries: [],
    total: null,
    start: 0,
    count: 20,
    loading: false,
    error: '',
    selected: {},
    registering: false,
    regError: '',
    regResult: null,

    get selectedCount() { return Object.keys(this.selected).length; },
    get hasMore() {
      if (this.total === null) return this.entries.length === this.count;
      return this.start + this.count < this.total;
    },

    async loadPage() {
      this.loading = true;
      this.error = '';
      try {
        const url = '/api/libraries/' + this.libraryId +
          '/entries?start=' + this.start + '&count=' + this.count;
        const r = await fetch(url);
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          this.error = (d.error || 'LOAD_FAILED').toUpperCase().slice(0, 80);
          this.entries = [];
          return;
        }
        const d = await r.json();
        this.entries = d.entries || [];
        this.total = d.total_results;
      } catch (e) {
        this.error = 'NETWORK_ERROR';
      } finally {
        this.loading = false;
      }
    },

    toggle(entry) {
      if (this.selected[entry.entry_id]) delete this.selected[entry.entry_id];
      else this.selected[entry.entry_id] = entry;
    },

    prevPage() {
      this.start = Math.max(0, this.start - this.count);
      this.loadPage();
    },
    nextPage() {
      this.start += this.count;
      this.loadPage();
    },

    async register() {
      this.registering = true;
      this.regError = '';
      this.regResult = null;
      try {
        const r = await fetch('/api/libraries/' + this.libraryId + '/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({entries: Object.values(this.selected)})
        });
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          this.regError = (d.error || 'INSTALL_FAILED').toUpperCase().slice(0, 80);
          return;
        }
        this.regResult = await r.json();
        this.selected = {};
        if (!this.regResult.failed || this.regResult.failed.length === 0) {
          setTimeout(() => { this.open = false; window.location.reload(); }, 800);
        }
      } catch (e) {
        this.regError = 'NETWORK_ERROR';
      } finally {
        this.registering = false;
      }
    },
  }"
  @libraries-modal-open.window="
    libraryId = $event.detail.id;
    libraryName = $event.detail.name;
    entries = []; total = null; start = 0;
    selected = {}; error = ''; regError = ''; regResult = null;
    open = true;
    loadPage();
  "
  x-show="open"
  x-cloak
  @keydown.escape.window="open = false"
  @click.self="open = false"
  class="fixed inset-0 z-50 bg-background/88 flex items-center justify-center p-4"
>
  <div class="bg-surface-container-lowest border border-outline-variant/60 w-full max-w-3xl max-h-[90dvh] sm:max-h-[80dvh] flex flex-col"
       @click.stop>

    <!-- Header -->
    <div class="px-3 sm:px-6 py-4 border-b border-outline-variant/20 flex items-center justify-between flex-shrink-0">
      <div class="min-w-0">
        <div class="font-headline font-bold text-[10px] uppercase tracking-[0.16em] text-primary-container">PICK_FROM_LIBRARY</div>
        <div class="font-body text-[13px] text-on-surface mt-1 truncate" x-text="libraryName"></div>
      </div>
      <button @click="open = false"
              class="tac-icon-btn text-on-surface/40 hover:text-on-surface -my-2">
        <span class="material-symbols-outlined text-[18px]"
              style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">close</span>
      </button>
    </div>

    <!-- Pagination + count -->
    <div class="px-3 sm:px-6 py-2 border-b border-outline-variant/15 flex items-center gap-3 text-[10px] font-headline uppercase tracking-[0.08em] text-on-surface/40 flex-shrink-0">
      <span>
        <span x-text="start + 1"></span>–<span x-text="Math.min(start + entries.length, total ?? (start + entries.length))"></span>
        <template x-if="total !== null">
          <span> of <span x-text="total"></span></span>
        </template>
      </span>
      <span class="flex-1"></span>
      <button @click="prevPage()" :disabled="start === 0 || loading"
              :class="(start === 0 || loading) ? 'opacity-30 cursor-not-allowed' : 'hover:text-primary-container'"
              class="tac-btn px-2">
        ← PREV
      </button>
      <button @click="nextPage()" :disabled="!hasMore || loading"
              :class="(!hasMore || loading) ? 'opacity-30 cursor-not-allowed' : 'hover:text-primary-container'"
              class="tac-btn px-2">
        NEXT →
      </button>
    </div>

    <!-- Error / loading -->
    <div x-show="error" x-cloak
         class="px-3 sm:px-6 py-3 font-headline text-[10px] tracking-[0.08em] uppercase text-error flex-shrink-0">
      <span x-text="error"></span>
    </div>
    <div x-show="loading && entries.length === 0" x-cloak
         class="px-3 sm:px-6 py-10 font-headline text-[10px] uppercase tracking-[0.16em] text-on-surface/40 text-center flex-shrink-0">
      LOADING…
    </div>

    <!-- Entry list -->
    <div class="flex-1 overflow-y-auto">
      <template x-for="entry in entries" :key="entry.entry_id">
        <label class="flex items-start gap-3 px-3 sm:px-6 py-3 border-b border-outline-variant/15 hover:bg-surface-container-low cursor-pointer">
          <input type="checkbox"
                 :checked="!!selected[entry.entry_id]"
                 @change="toggle(entry)"
                 class="mt-1 accent-primary-container">
          <template x-if="entry.thumbnail_url">
            <img :src="entry.thumbnail_url" alt=""
                 class="w-10 h-10 flex-shrink-0 bg-surface-container"
                 onerror="this.style.display='none'">
          </template>
          <div class="flex-1 min-w-0">
            <div class="font-headline font-bold text-[12px] text-on-surface truncate tracking-[0.04em] uppercase"
                 x-text="entry.title.replace(/ /g, '_')"></div>
            <template x-if="entry.summary">
              <div class="font-body text-[10px] text-on-surface/60 mt-[2px] line-clamp-2" x-text="entry.summary"></div>
            </template>
            <div class="font-body text-[9px] text-on-surface/40 mt-[3px] flex gap-3 uppercase tracking-[0.06em]">
              <template x-if="entry.language"><span x-text="entry.language"></span></template>
              <template x-if="entry.size_bytes">
                <span x-text="(entry.size_bytes/1e9).toFixed(2) + ' GB'"></span>
              </template>
            </div>
          </div>
        </label>
      </template>
      <div x-show="!loading && entries.length === 0 && !error" x-cloak
           class="px-3 sm:px-6 py-10 font-body text-[10px] text-on-surface/40 text-center uppercase tracking-[0.08em]">
        NO_ENTRIES
      </div>
    </div>

    <!-- Install result -->
    <template x-if="regResult">
      <div class="px-3 sm:px-6 py-3 border-t border-outline-variant/20 flex-shrink-0"
           :class="regResult.failed && regResult.failed.length ? 'bg-error/5' : 'bg-tertiary/5'">
        <div class="font-headline text-[10px] uppercase tracking-[0.08em]"
             :class="regResult.failed && regResult.failed.length ? 'text-error' : 'text-tertiary'">
          INSTALLING <span x-text="regResult.registered.length"></span>
          <template x-if="regResult.failed && regResult.failed.length">
            <span> · <span x-text="regResult.failed.length"></span> FAILED</span>
          </template>
        </div>
        <template x-if="regResult.failed && regResult.failed.length">
          <ul class="font-body text-[10px] text-error/70 mt-1 space-y-[2px]">
            <template x-for="f in regResult.failed" :key="f.title">
              <li><span x-text="f.title"></span> — <span x-text="f.reason"></span></li>
            </template>
          </ul>
        </template>
      </div>
    </template>

    <!-- Footer actions -->
    <div class="px-3 sm:px-6 py-3 border-t border-outline-variant/20 flex items-center flex-wrap gap-2 sm:gap-3 flex-shrink-0">
      <span class="font-headline text-[10px] uppercase tracking-[0.08em] text-on-surface/40">
        <span x-text="selectedCount"></span> SELECTED
      </span>
      <div x-show="regError" x-cloak class="font-headline text-[10px] tracking-[0.08em] text-error uppercase">
        <span x-text="regError"></span>
      </div>
      <span class="flex-1"></span>
      <button @click="open = false"
              class="tac-btn font-headline text-[10px] uppercase tracking-[0.08em] px-4 border border-outline-variant/30 text-on-surface/40 hover:bg-surface-container-high">
        CLOSE
      </button>
      <button @click="register()"
              :disabled="registering || selectedCount === 0"
              :class="(registering || selectedCount === 0) ? 'opacity-40 cursor-not-allowed' : 'hover:bg-primary-container/10'"
              class="tac-btn font-headline text-[10px] font-bold uppercase tracking-[0.08em] px-4 border border-primary-container/50 text-primary-container">
        <span x-show="!registering">INSTALL</span>
        <span x-show="registering" x-cloak>INSTALLING…</span>
      </button>
    </div>

  </div>
</div>
