<!DOCTYPE html>
<html lang="en" class="lg:h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyberdeck</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script defer src="/static/js/alpine.min.js"></script>
  <script defer src="/static/js/toasts.js"></script>
</head>
<body
  {# lg+: overflow-hidden locks the fixed kiosk shell; below lg the body scrolls naturally. #}
  class="bg-surface text-on-surface font-body min-h-dvh lg:h-full lg:overflow-hidden flex flex-col"
  x-data="{
    battery_pct: {{ battery_pct | tojson }},
    battery_charging: {{ battery_charging | tojson }},
    wifi_connected: {{ wifi_connected | tojson }},
    is_online: {{ is_online | default(None) | tojson }},
    connectivity: { last_state: 'unknown', last_latency_ms: null, last_checked_at: null, target: null },
    wifi_panel_open: false,
    connectivity_panel_open: false,
    lastActivity: Date.now(),
    dimmed: false,
    restorePct: null,
    batteryIcon() {
      if (this.battery_charging) return 'battery_charging_full';
      if (this.battery_pct === null) return 'power';
      if (this.battery_pct >= 90) return 'battery_full';
      if (this.battery_pct >= 75) return 'battery_6_bar';
      if (this.battery_pct >= 60) return 'battery_5_bar';
      if (this.battery_pct >= 45) return 'battery_4_bar';
      if (this.battery_pct >= 30) return 'battery_3_bar';
      if (this.battery_pct >= 15) return 'battery_2_bar';
      if (this.battery_pct >= 5)  return 'battery_1_bar';
      return 'battery_0_bar';
    },
    batteryClass() {
      if (this.battery_charging) return 'text-tertiary cursor-pointer hover:text-primary';
      if (this.battery_pct !== null && this.battery_pct < 15) return 'text-error animate-pulse cursor-pointer';
      return 'text-on-surface/70 cursor-pointer hover:text-primary';
    },
    async poll() {
      if (this.dimmed) return;
      try {
        const r = await fetch('/api/system');
        const d = await r.json();
        this.battery_pct = d.battery_pct;
        this.battery_charging = d.battery_charging;
        this.wifi_connected = d.wifi_connected;
        if ('is_online' in d) this.is_online = d.is_online;
        if (d.connectivity) this.connectivity = d.connectivity;
        if (d.notifications) {
          window.dispatchEvent(new CustomEvent('notifications-update', { detail: d.notifications }));
        }
      } catch(e) {}
    },
    async initBrightness() {
      try {
        const r = await fetch('/api/system/brightness');
        const d = await r.json();
        this.restorePct = d.brightness_pct;
      } catch(e) {}
    },
    async _setBrightness(pct) {
      try {
        await fetch('/api/system/brightness', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({level: pct})
        });
      } catch(e) {}
    },
    _onActivity() {
      this.lastActivity = Date.now();
      if (this.dimmed) {
        this.dimmed = false;
        this._setBrightness(this.restorePct ?? 100);
      }
    }
  }"
  x-init="
    initBrightness();
    setInterval(() => poll(), 10000);
    setInterval(() => {
      if (!dimmed && Date.now() - lastActivity > 120000) {
        dimmed = true;
        _setBrightness(10);
      }
    }, 30000);
    ['mousemove', 'keydown', 'click', 'touchstart'].forEach(e =>
      window.addEventListener(e, () => _onActivity(), {passive: true})
    );
  "
  @keydown.ctrl.k.window.prevent="document.getElementById('search') && document.getElementById('search').focus()"
>

  <!-- ── Header ── -->
  <header class="bg-surface w-full z-50 flex justify-between items-center px-3 sm:px-6 flex-shrink-0 border-b border-outline-variant/15 h-16 sticky top-0 lg:static">

    <!-- Left: brand + search -->
    <div class="flex items-center gap-3 sm:gap-6 min-w-0">
      <!-- Logo + Wordmark (links to homepage) -->
      <a href="/" class="flex items-center gap-3 sm:gap-6 flex-shrink-0 min-w-0">
        <div class="w-10 h-10 bg-primary-container flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-on-primary-container text-2xl" style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">radar</span>
        </div>
        <div class="flex flex-col min-w-0">
          <div class="text-base sm:text-xl font-bold text-primary-container tracking-tighter font-headline uppercase leading-none truncate">
            SURVIVAL_DASHBOARD
          </div>
          <div class="hidden sm:block text-[8px] font-label tracking-[0.3em] uppercase mt-1 leading-none text-primary-container/60">
            SECURE_ACCESS // SECTOR_G14
          </div>
        </div>
      </a>

      <!-- Search -->
      <div class="hidden xl:flex items-center bg-surface-container-lowest px-4 py-1.5 gap-3 ml-4 relative border border-outline-variant/20"
           x-data="{
             searchQuery: '',
             searchResults: [],
             searchOpen: false,
             async search() {
               if (this.searchQuery.length < 2) { this.searchResults = []; this.searchOpen = false; return; }
               try {
                 const r = await fetch('/api/search?q=' + encodeURIComponent(this.searchQuery));
                 this.searchResults = await r.json();
                 this.searchOpen = this.searchResults.length > 0;
               } catch(e) { this.searchResults = []; }
             }
           }"
      >
        <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">search</span>
        <input
          id="search"
          type="text"
          x-model="searchQuery"
          @input.debounce.300ms="search()"
          @keydown.escape="searchResults = []; searchOpen = false"
          placeholder="QUERY_DATABASE..."
          class="bg-transparent border-none focus:ring-0 text-[10px] font-label uppercase tracking-wider w-48 text-on-surface placeholder:opacity-30 outline-none"
          autocomplete="off"
        >
        <!-- Search results dropdown -->
        <div x-show="searchOpen && searchResults.length > 0" x-cloak
             class="absolute top-full left-0 mt-1 bg-surface-container border border-outline-variant/30 overflow-hidden z-50 w-80">
          <template x-for="result in searchResults" :key="result.title + result.module">
            <a :href="result.url"
               class="flex items-center gap-3 px-4 py-3 border-b border-outline-variant/20 last:border-b-0 hover:bg-surface-container-high"
               @click="searchOpen = false; searchQuery = ''">
              <span class="text-on-surface-variant text-[10px] tracking-[0.08em] uppercase font-label min-w-[80px]" x-text="result.module"></span>
              <span class="text-on-surface text-[13px] font-body truncate" x-text="result.title"></span>
            </a>
          </template>
        </div>
      </div>
    </div>

    <!-- Right: status + shutdown -->
    <div class="flex items-center gap-1 sm:gap-6 flex-shrink-0">

      <!-- System icons -->
      <div class="flex items-center gap-0 sm:gap-4 text-on-surface/70">
        <a href="/settings" title="Settings" class="tac-icon-btn hover:text-primary">
          <span class="material-symbols-outlined cursor-pointer"
                style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">settings</span>
        </a>
        <span class="tac-icon-btn cursor-pointer"
              :class="batteryClass()"
              :title="'Battery: ' + (battery_pct ?? '?') + '%' + (battery_charging ? ' (charging)' : '')">
          <span class="material-symbols-outlined"
                style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24"
                x-text="batteryIcon()">battery_full</span>
        </span>
        <button type="button"
                @click="wifi_panel_open = !wifi_panel_open"
                :class="wifi_connected ? 'text-tertiary hover:text-primary' : 'hover:text-primary'"
                :title="wifi_connected ? 'WIFI_CONNECTED' : 'WIFI_DISCONNECTED'"
                class="tac-icon-btn">
          <span class="material-symbols-outlined cursor-pointer"
                style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24"
                x-text="wifi_connected ? 'wifi' : 'wifi_off'">wifi</span>
        </button>

        <button type="button"
                x-show="is_online !== null"
                x-cloak
                @click="connectivity_panel_open = !connectivity_panel_open"
                :class="is_online ? 'text-success hover:text-primary' : 'text-on-surface/40 hover:text-primary'"
                :title="is_online ? 'ONLINE' : 'OFFLINE'"
                class="tac-icon-btn">
          <span class="material-symbols-outlined cursor-pointer"
                style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24"
                x-text="is_online ? 'public' : 'public_off'">public</span>
        </button>

        {% include "_power_menu.html" %}
      </div>
    </div>
  </header>

  <!-- ── Main content ── -->
  <div class="flex-1 flex flex-col lg:overflow-hidden">
    {% block content %}{% endblock %}
  </div>

  {% include "_wifi_panel.html" %}
  {% include "_connectivity_panel.html" %}
  {% include "_toasts.html" %}

</body>
</html>
