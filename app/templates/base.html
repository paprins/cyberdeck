<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Cyberdeck</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script defer src="/static/js/alpine.min.js"></script>
</head>
<body
  class="bg-bg text-text-hi font-display h-full overflow-hidden flex flex-col"
  x-data="{
    battery_pct: {{ battery_pct | tojson }},
    wifi_connected: {{ wifi_connected | tojson }},
    lastActivity: Date.now(),
    dimmed: false,
    restorePct: null,
    async poll() {
      try {
        const r = await fetch('/api/system');
        const d = await r.json();
        this.battery_pct = d.battery_pct;
        this.wifi_connected = d.wifi_connected;
      } catch(e) {}
    },
    async initBrightness() {
      try {
        const r = await fetch('/api/system/brightness');
        const d = await r.json();
        this.restorePct = d.brightness_pct;
      } catch(e) {}
    },
    async _setBrightness(pct) {
      try {
        await fetch('/api/system/brightness', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({level: pct})
        });
      } catch(e) {}
    },
    _onActivity() {
      this.lastActivity = Date.now();
      if (this.dimmed) {
        this.dimmed = false;
        this._setBrightness(this.restorePct ?? 100);
      }
    }
  }"
  x-init="
    initBrightness();
    setInterval(() => poll(), 10000);
    setInterval(() => {
      if (!dimmed && Date.now() - lastActivity > 120000) {
        dimmed = true;
        _setBrightness(10);
      }
    }, 30000);
    ['mousemove', 'keydown', 'click', 'touchstart'].forEach(e =>
      window.addEventListener(e, () => _onActivity(), {passive: true})
    );
  "
  @keydown.ctrl.k.window.prevent="document.getElementById('search') && document.getElementById('search').focus()"
>

  <!-- ── Topbar ── -->
  <header class="flex-shrink-0 flex items-center px-5 gap-5"
          style="height:48px; border-bottom: 1px solid var(--color-border); background: var(--color-bg);">

    <!-- Brand -->
    <a href="/" class="flex flex-col justify-center flex-shrink-0">
      <div class="font-display font-bold text-[13px] tracking-[0.18em] text-amber uppercase leading-none">⬡ CYBERDECK</div>
      <div class="font-display text-[9px] tracking-[0.14em] text-text-lo uppercase mt-[4px]">SURVIVAL_DASHBOARD</div>
    </a>

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- System status -->
    <div class="flex items-center gap-4 flex-shrink-0">

      <!-- Battery -->
      <div class="flex items-center gap-[8px]">
        <span class="font-display text-[9px] tracking-[0.10em] text-text-lo uppercase">BATT</span>
        <div class="w-[56px] h-[3px] bg-elevated rounded-full overflow-hidden">
          <div class="h-full bg-amber rounded-full"
               :style="`width: ${battery_pct ?? 0}%`"
               style="width: {{ battery_pct or 0 }}%"></div>
        </div>
        <span class="font-display text-[11px] font-bold text-text-hi tabular-nums"
              x-text="battery_pct !== null ? battery_pct + '%' : '—'">{{ (battery_pct ~ '%') if battery_pct is not none else '—' }}</span>
      </div>

      <!-- Divider -->
      <div class="h-4 w-px bg-border"></div>

      <!-- Signal -->
      <div class="flex items-center gap-[8px]">
        <span class="font-display text-[9px] tracking-[0.10em] text-text-lo uppercase">SIG</span>
        <span class="font-display text-[10px] tracking-[0.10em] font-bold"
              :class="wifi_connected ? 'text-tile-maps' : 'text-amber'"
              x-text="wifi_connected ? 'ONLINE' : 'OFFLINE'">{{ 'ONLINE' if wifi_connected else 'OFFLINE' }}</span>
      </div>

    </div>
  </header>

  <!-- ── Main content ── -->
  <div class="flex-1 flex flex-col overflow-hidden"
       style="background-image: radial-gradient(circle, oklch(19% 0.007 50) 1px, transparent 1px); background-size: 28px 28px;">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
