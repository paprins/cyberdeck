<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Cyberdeck</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script defer src="/static/js/alpine.min.js"></script>
</head>
<body
  class="bg-bg text-text-hi font-display h-full overflow-hidden flex"
  x-data="{
    battery_pct: {{ battery_pct | tojson }},
    wifi_connected: {{ wifi_connected | tojson }},
    lastActivity: Date.now(),
    dimmed: false,
    restorePct: null,
    async poll() {
      try {
        const r = await fetch('/api/system');
        const d = await r.json();
        this.battery_pct = d.battery_pct;
        this.wifi_connected = d.wifi_connected;
      } catch(e) {}
    },
    async initBrightness() {
      try {
        const r = await fetch('/api/system/brightness');
        const d = await r.json();
        this.restorePct = d.brightness_pct;
      } catch(e) {}
    },
    async _setBrightness(pct) {
      try {
        await fetch('/api/system/brightness', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({level: pct})
        });
      } catch(e) {}
    },
    _onActivity() {
      this.lastActivity = Date.now();
      if (this.dimmed) {
        this.dimmed = false;
        this._setBrightness(this.restorePct ?? 100);
      }
    }
  }"
  x-init="
    initBrightness();
    setInterval(() => poll(), 10000);
    setInterval(() => {
      if (!dimmed && Date.now() - lastActivity > 120000) {
        dimmed = true;
        _setBrightness(10);
      }
    }, 30000);
    ['mousemove', 'keydown', 'click', 'touchstart'].forEach(e =>
      window.addEventListener(e, () => _onActivity(), {passive: true})
    );
  "
  @keydown.ctrl.k.window.prevent="document.getElementById('search') && document.getElementById('search').focus()"
>

  <!-- ── Sidebar ── -->
  <aside class="w-[200px] flex-shrink-0 flex flex-col overflow-hidden"
         style="background: var(--color-bg); border-right: 1px solid var(--color-border);">

    <!-- Brand -->
    <div class="px-5 pt-6 pb-5 flex-shrink-0">
      <div class="font-display font-bold text-[13px] tracking-[0.18em] text-amber uppercase">⬡ CYBERDECK</div>
      <div class="font-display text-[9px] tracking-[0.14em] text-text-lo uppercase mt-[5px]">NODE_01</div>
    </div>

    <div class="mx-4 h-px bg-border flex-shrink-0"></div>

    <!-- Nav -->
    <nav class="px-3 py-3 flex flex-col gap-[3px] flex-shrink-0">
      <a href="/"
         class="px-3 py-[11px] font-display text-[11px] tracking-[0.12em] uppercase rounded-tile block
                {% if request.url.path == '/' %}bg-amber text-bg font-bold{% else %}text-text-mid hover:text-text-hi hover:bg-elevated{% endif %}">
        LIBRARY
      </a>
      <a href="/packages"
         class="px-3 py-[11px] font-display text-[11px] tracking-[0.12em] uppercase rounded-tile block
                {% if request.url.path == '/packages' %}bg-amber text-bg font-bold{% else %}text-text-mid hover:text-text-hi hover:bg-elevated{% endif %}">
        PACKAGES
      </a>
    </nav>

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- System status -->
    <div class="flex-shrink-0 mx-4 mb-5 pt-4 flex flex-col gap-[10px]"
         style="border-top: 1px solid var(--color-border);">

      <!-- Battery -->
      <div>
        <div class="flex items-center justify-between mb-[5px]">
          <span class="font-display text-[9px] tracking-[0.10em] text-text-lo uppercase">Battery</span>
          <span class="font-display text-[11px] font-bold text-text-hi"
                x-text="battery_pct !== null ? battery_pct + '%' : '—'">{{ (battery_pct ~ '%') if battery_pct is not none else '—' }}</span>
        </div>
        <div class="h-[3px] bg-elevated rounded-full overflow-hidden">
          <div class="h-full bg-amber rounded-full"
               :style="`width: ${battery_pct ?? 0}%`"
               style="width: {{ battery_pct or 0 }}%"></div>
        </div>
      </div>

      <!-- Signal -->
      <div class="flex items-center justify-between">
        <span class="font-display text-[9px] tracking-[0.10em] text-text-lo uppercase">Signal</span>
        <span class="font-display text-[10px] tracking-[0.10em] font-bold"
              :class="wifi_connected ? 'text-tile-maps' : 'text-amber'"
              x-text="wifi_connected ? 'ONLINE' : 'OFFLINE'">{{ 'ONLINE' if wifi_connected else 'OFFLINE' }}</span>
      </div>

    </div>
  </aside>

  <!-- ── Main content ── -->
  <div class="flex-1 flex flex-col overflow-hidden"
       style="background-image: radial-gradient(circle, oklch(19% 0.007 50) 1px, transparent 1px); background-size: 28px 28px;">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
