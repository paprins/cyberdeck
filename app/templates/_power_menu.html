<!-- ── Power menu ── -->
<div class="relative" x-data="{
  open: false,
  pending: null,
  busy: false,
  error: '',
  done: false,
  overlay: null,
  labels: {
    restart:  { title: 'RESTART_CONTENT', body: 'Restart the library and map services?', confirm: 'RESTART' },
    reboot:   { title: 'REBOOT_DEVICE',    body: 'Reboot the device now?',                confirm: 'REBOOT' },
    shutdown: { title: 'SHUTDOWN_DEVICE',  body: 'Shut down the device now?',             confirm: 'SHUTDOWN' },
  },
  urls: {
    restart:  '/api/system/restart-services',
    reboot:   '/api/system/reboot',
    shutdown: '/api/system/shutdown',
  },
  pick(action) {
    this.pending = action;
    this.open = false;
    this.error = '';
    this.done = false;
  },
  closeModal() {
    if (this.busy) return;
    this.pending = null;
    this.error = '';
    this.done = false;
  },
  async confirm() {
    this.busy = true;
    this.error = '';
    try {
      const r = await fetch(this.urls[this.pending], {method: 'POST'});
      if (r.ok) {
        if (this.pending === 'restart') {
          this.done = true;
        } else {
          this.overlay = this.pending;
          this.pending = null;
        }
      } else if (r.status === 503) {
        this.error = 'NOT AVAILABLE IN DEV MODE';
      } else {
        const d = await r.json().catch(() => ({}));
        this.error = (d.detail || ('ERROR_' + r.status)).toString().toUpperCase();
      }
    } catch(e) {
      this.error = 'NETWORK_ERROR';
    }
    this.busy = false;
  }
}">

  <!-- Trigger -->
  <button type="button"
          @click="open = !open"
          :class="open ? 'text-primary' : 'hover:text-primary'"
          class="tac-icon-btn"
          title="Power">
    <span class="material-symbols-outlined cursor-pointer"
          style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">power_settings_new</span>
  </button>

  <!-- Dropdown -->
  <div x-show="open" x-cloak @click.outside="open = false"
       class="absolute top-full right-0 mt-1 bg-surface-container border border-outline-variant/30 z-50 min-w-[200px] max-w-[calc(100vw-1rem)]">
    <button @click="pick('restart')" type="button"
            class="w-full flex items-center gap-3 px-4 py-3 border-b border-outline-variant/15 hover:bg-surface-container-high text-on-surface text-left">
      <span class="material-symbols-outlined text-[18px]"
            style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">refresh</span>
      <span class="font-headline text-[10px] tracking-[0.08em] uppercase">RESTART_CONTENT</span>
    </button>
    <button @click="pick('reboot')" type="button"
            class="w-full flex items-center gap-3 px-4 py-3 border-b border-outline-variant/15 hover:bg-surface-container-high text-on-surface text-left">
      <span class="material-symbols-outlined text-[18px]"
            style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">restart_alt</span>
      <span class="font-headline text-[10px] tracking-[0.08em] uppercase">REBOOT</span>
    </button>
    <button @click="pick('shutdown')" type="button"
            class="w-full flex items-center gap-3 px-4 py-3 hover:bg-error/10 text-error text-left">
      <span class="material-symbols-outlined text-[18px]"
            style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">power_settings_new</span>
      <span class="font-headline text-[10px] tracking-[0.08em] uppercase">SHUTDOWN</span>
    </button>
  </div>

  <!-- Confirm modal -->
  <div x-show="pending !== null && overlay === null" x-cloak
       @keydown.escape.window="if (!busy) closeModal()"
       @click.self="if (!busy) closeModal()"
       class="fixed inset-0 z-50 bg-background/88 flex items-center justify-center p-4">
    <div class="bg-surface-container-lowest border border-outline-variant/60 p-6 w-full max-w-sm" @click.stop>
      <div class="font-headline font-bold text-[10px] uppercase tracking-[0.16em] text-primary-container mb-3"
           x-text="labels[pending]?.title"></div>
      <p class="font-body text-[12px] text-on-surface/60 mb-6" x-text="labels[pending]?.body"></p>

      <div x-show="error" x-cloak class="font-headline text-[10px] tracking-[0.08em] text-error mb-3 uppercase">
        <span x-text="error"></span>
      </div>
      <div x-show="done" x-cloak class="font-headline text-[10px] tracking-[0.08em] text-tertiary mb-3 uppercase">
        CONTENT_RESTARTED
      </div>

      <div class="flex gap-3">
        <button @click="closeModal()"
                :disabled="busy"
                :class="busy ? 'opacity-40 cursor-not-allowed' : 'hover:bg-surface-container-high'"
                class="tac-btn flex-1 font-headline text-[10px] uppercase tracking-[0.08em] py-3 border border-outline-variant/30 text-on-surface/40">
          <span x-text="done ? 'CLOSE' : 'CANCEL'"></span>
        </button>
        <button x-show="!done" @click="confirm()"
                :disabled="busy"
                :class="busy ? 'opacity-40 cursor-not-allowed' : 'hover:bg-primary-container/10'"
                class="tac-btn flex-1 font-headline text-[10px] uppercase tracking-[0.08em] py-3 border border-primary-container/50 text-primary-container">
          <span x-show="!busy" x-text="labels[pending]?.confirm"></span>
          <span x-show="busy" x-cloak>...</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Full-screen overlay (reboot / shutdown — terminal state) -->
  <div x-show="overlay !== null" x-cloak
       class="fixed inset-0 z-[60] bg-background flex flex-col items-center justify-center">
    <div class="font-headline text-[13px] tracking-[0.2em] uppercase text-on-surface/70"
         x-text="overlay === 'reboot' ? 'REBOOTING...' : 'SHUTTING DOWN...'"></div>
    <div class="font-body text-[10px] text-on-surface/40 mt-3 uppercase tracking-[0.08em]">
      device will be unavailable
    </div>
  </div>

</div>
